---
name: mirror

# 按 manifest.tsv 从源地址搬运安装包到本仓库 Release。
# manifest.tsv 格式：TAG<TAB>URL<TAB>FILENAME<TAB>SHA256
# 每行一个文件；同 TAG 的文件归入同一个 Release。

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 只处理指定 tag（空格分隔；留空表示全部）
        required: false
        default: ''
      force:
        description: 强制重搬（忽略“已存在”判断）
        type: boolean
        required: false
        default: false

permissions: write-all

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析 manifest，筛出待处理 tag
        id: list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAGS: ${{ inputs.tags }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          grep -v '^TAG' manifest.tsv | grep -v '^[[:space:]]*$' > all.tsv
          echo "清单条目: $(wc -l < all.tsv)"

          mapfile -t ALL_TAGS < <(cut -f1 all.tsv | awk '!seen[$0]++')
          echo "版本数: ${#ALL_TAGS[@]}"

          SELECTED=()
          for t in "${ALL_TAGS[@]}"; do
            if [ -n "$INPUT_TAGS" ] && ! printf '%s\n' $INPUT_TAGS | grep -qx "$t"; then
              continue
            fi
            if [ "$FORCE" != "true" ]; then
              EXPECT=$(awk -F'\t' -v t="$t" '$1==t' all.tsv | wc -l)
              OURS=$(gh api "repos/${{ github.repository }}/releases/tags/$t" \
                --jq '[.assets[] | select(.name | endswith("SUMS") | not)] | length' \
                2>/dev/null || echo 0)
              if [ "$EXPECT" = "$OURS" ]; then
                echo "跳过 $t（应有 $EXPECT 个，已有 $OURS 个）"
                continue
              fi
            fi
            SELECTED+=("$t")
          done

          if [ ${#SELECTED[@]} -eq 0 ]; then
            JSON="[]"
          else
            JSON=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -sc .)
          fi
          echo "待处理: $JSON"
          echo "tags=$JSON" >> "$GITHUB_OUTPUT"

  fetch:
    needs: prepare
    if: needs.prepare.outputs.tags != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        tag: ${{ fromJSON(needs.prepare.outputs.tags) }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载 ${{ matrix.tag }}
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          grep -v '^TAG' manifest.tsv | awk -F'\t' -v t="$TAG" '$1==t {print $2"\t"$3"\t"$4}' > plan.tsv
          echo "本版本文件数: $(wc -l < plan.tsv)"

          FAILED=0
          while IFS=$'\t' read -r url name want; do
            [ -z "$name" ] && continue
            echo "下载 $name"
            ok=0
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 \
                   -C - -o "out/$name" "$url"; then
                if [ -s "out/$name" ]; then ok=1; break; fi
                echo "文件为空，重试 $attempt"
              else
                echo "下载失败，重试 $attempt"
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$name 下载失败"
              FAILED=1
              continue
            fi
            if [ -n "$want" ]; then
              got=$(sha256sum "out/$name" | cut -d' ' -f1)
              if [ "$got" != "$want" ]; then
                echo "::error::$name sha256 不符：期望 $want 实际 $got"
                FAILED=1
              else
                echo "$name sha256 校验通过"
              fi
            else
              echo "$name 无预期摘要，跳过校验"
            fi
          done < plan.tsv

          if [ "$FAILED" = "1" ]; then
            echo "::error::存在失败项，中止发布"
            exit 1
          fi
          ls -lh out

      - name: 生成校验文件
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          cd out
          sha256sum QQ-* > SHA256SUMS
          cat SHA256SUMS

      - name: 发布 ${{ matrix.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          {
            echo '## SHA256 Checksums'
            echo '```'
            cat out/SHA256SUMS
            echo '```'
          } > note.md
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "QQ $TAG" --notes-file note.md
          fi
          gh release upload "$TAG" out/* --repo "$REPO" --clobber
          echo "已发布 $TAG"
