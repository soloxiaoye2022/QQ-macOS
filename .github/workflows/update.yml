---
name: update

# 每日检查腾讯官方配置，发现新版本自动下载发布。
# QQNTV2 路径 403 时回退到社区归档仓库。
# 归档命名 QQ_v7.0.3.54276.dmg 与官方 QQ_7.0.3_261103_01.dmg 不同，按版本号匹配。

on:
  workflow_dispatch:
    inputs:
      force:
        description: 已存在同版本也强制重发
        type: boolean
        required: false
        default: false
  schedule:
    - cron: 30 21 * * *

permissions: write-all

concurrency:
  group: update
  cancel-in-progress: false

env:
  ARCHIVE_REPO: A-Randomm-User/macOS-save
  ARCHIVE_TAG: qq

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cfg.outputs.version }}
      need: ${{ steps.cfg.outputs.need }}
    steps:
      - name: 读取官方 macOS 配置
        id: cfg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 30 \
            https://qq-web.cdn-go.cn/im.qq.com_new/latest/rainbow/pcConfig.json -o pc.json

          RAW=$(jq -r '.macOS.version' pc.json)
          VER=$(echo "$RAW" | sed -E 's/ *\(.*//')
          echo "官方版本: $VER（原始 $RAW）"

          NEED=true
          if [ "$FORCE" != "true" ]; then
            HIT=$(gh release list --repo "${{ github.repository }}" --limit 200 \
              --json tagName --jq "[.[] | select(.tagName | startswith(\"${VER}\"))] | length")
            if [ "$HIT" != "0" ]; then
              NEED=false
              echo "已存在 $VER 的发布（$HIT 条），跳过"
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cfg
          path: pc.json
          retention-days: 1

  build:
    needs: check
    if: needs.check.outputs.need == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cfg

      - name: 下载 dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          URL=$(jq -r '.macOS.downloadUrl' pc.json)
          echo "官方地址: $URL"

          # 生成 tag：官方 QQ_7.0.3_261103_01.dmg -> 7.0.3-261103
          BASE=$(basename "$URL")
          if echo "$BASE" | grep -qE '^QQ_v?[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.dmg$'; then
            TAG=$(echo "$BASE" | sed -E 's/^QQ_v?([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)\.dmg$/\1-\2/')
          else
            DATE=$(echo "$BASE" | sed -E 's/^QQ_[0-9.]+_([0-9]{6})_.*$/\1/')
            TAG="${VER}-${DATE}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          if curl -fsSL --retry 2 --connect-timeout 30 -o "out/QQ-${TAG}-universal.dmg" "$URL"; then
            echo "官方源下载成功"
          else
            echo "官方源不可用，查归档"
            gh api "repos/$ARCHIVE_REPO/releases/tags/$ARCHIVE_TAG" > archive.json
            AURL=$(jq -r --arg v "$VER" '
              .assets[]?
              | select(.name | test("^QQ_v?" + ($v | gsub("\\."; "\\.")) + "[._]"))
              | .browser_download_url' archive.json | head -1)
            if [ -z "$AURL" ] || [ "$AURL" = "null" ]; then
              echo "::error::$VER 归档中无匹配"
              exit 1
            fi
            echo "归档地址: $AURL"
            curl -fsSL --retry 3 --connect-timeout 30 \
              -o "out/QQ-${TAG}-universal.dmg" "$AURL"
          fi
          ls -lh out

      - name: 生成校验文件并发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd out
          sha256sum QQ-* > SHA256SUMS
          cat SHA256SUMS
          {
            echo '## SHA256 Checksums'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../note.md
          cd ..
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "QQ $TAG" --notes-file note.md
          fi
          gh release upload "$TAG" out/* --repo "$REPO" --clobber
          echo "已发布 $TAG"

  keepalive:
    if: github.event_name == 'schedule'
    name: Keepalive
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Re-enable workflow
        run: |
          case "${GITHUB_WORKFLOW_REF:?}" in
          "${GITHUB_REPOSITORY:?}"/.github/workflows/*.y*ml@*) ;;
          *) false ;;
          esac
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          workflow="${workflow#${GITHUB_REPOSITORY}/.github/workflows/}"
          echo "Re-enable $workflow"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
