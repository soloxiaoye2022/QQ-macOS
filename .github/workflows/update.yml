---
name: update

# 每日检查腾讯官方配置，发现新版本自动下载发布。
# QQNTV2 路径 403 时回退到社区归档仓库。

on:
  workflow_dispatch:
    inputs:
      force:
        description: 已存在同版本也强制重发
        type: boolean
        required: false
        default: false
  schedule:
    - cron: 30 21 * * *

permissions: write-all

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.cfg.outputs.tag }}
      need: ${{ steps.cfg.outputs.need }}
    steps:
      - name: 读取官方 macOS 配置
        id: cfg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 30 \
            https://qq-web.cdn-go.cn/im.qq.com_new/latest/rainbow/pcConfig.json -o pc.json

          URL=$(jq -r '.macOS.downloadUrl' pc.json)
          VER=$(jq -r '.macOS.version' pc.json | sed -E 's/ *\(.*//')
          BASE=$(basename "$URL")

          # 两种命名：QQ_7.0.3_261103_01.dmg 或 QQ_v7.0.3.54276.dmg
          if echo "$BASE" | grep -qE '^QQ_v?[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.dmg$'; then
            TAG=$(echo "$BASE" | sed -E 's/^QQ_v?([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)\.dmg$/\1-\2/')
          else
            DATE=$(echo "$BASE" | sed -E 's/^QQ_[0-9.]+_([0-9]{6})_.*$/\1/')
            TAG="${VER}-${DATE}"
          fi

          echo "版本: $VER"
          echo "tag: $TAG"
          echo "url: $URL"

          NEED=true
          if [ "$FORCE" != "true" ]; then
            if gh api "repos/${{ github.repository }}/releases/tags/$TAG" > /dev/null 2>&1; then
              NEED=false
              echo "已存在 $TAG，跳过"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "need=$NEED" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: cfg
          path: pc.json
          retention-days: 1

  build:
    needs: check
    if: needs.check.outputs.need == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cfg

      - name: 下载 dmg
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          URL=$(jq -r '.macOS.downloadUrl' pc.json)
          NAME=$(basename "$URL")
          echo "官方地址: $URL"

          if curl -fsSL --retry 2 --connect-timeout 30 -o "out/$NAME" "$URL"; then
            echo "官方源下载成功"
          else
            echo "官方源不可用，尝试社区归档"
            ARCHIVE=https://github.com/A-Randomm-User/macOS-save/releases/download/qq
            if ! curl -fsSL --retry 3 --connect-timeout 30 -o "out/$NAME" "$ARCHIVE/$NAME"; then
              echo "::error::两个源都失败"
              exit 1
            fi
          fi
          ls -lh out

      - name: 重命名并发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          cd out
          for f in QQ*.dmg; do
            [ -e "$f" ] || continue
            mv "$f" "QQ-${TAG}-universal.dmg"
          done
          sha256sum QQ-* > SHA256SUMS
          cat SHA256SUMS
          {
            echo '## SHA256 Checksums'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > ../note.md
          cd ..
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "QQ $TAG" --notes-file note.md
          fi
          gh release upload "$TAG" out/* --repo "$REPO" --clobber
          echo "已发布 $TAG"

  keepalive:
    if: github.event_name == 'schedule'
    name: Keepalive
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Re-enable workflow
        run: |
          case "${GITHUB_WORKFLOW_REF:?}" in
          "${GITHUB_REPOSITORY:?}"/.github/workflows/*.y*ml@*) ;;
          *) false ;;
          esac
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          workflow="${workflow#${GITHUB_REPOSITORY}/.github/workflows/}"
          echo "Re-enable $workflow"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
